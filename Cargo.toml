[package]
name = "aise"
version = "2.42.1"
authors = ["Markus Heikkinen <ittevien@gmail.com>"]
edition = "2024"

[lib]
name = "aise"
crate-type = ["cdylib"]

[profile.dev]
opt-level = 1
panic = "abort"

[profile.release]
opt-level = "s"
debug = true
panic = "abort"
overflow-checks = true
lto = true

[dependencies]
bincode = "1.0"
bitflags = { version = "2.0", features = ["serde"] }
bumpalo = { version = "3.7", features = ["collections"] }
byteorder = "1.1"
directories = "6.0"
fern = "0.7"
hashbrown = { version = "0.17", features = ["serde"], default-features = false }
log = { version = "0.4", features = ["release_max_level_warn"] }
once_cell = "1.12"
parking_lot = "0.12"
rand = { version = "0.10", default-features = false }
rand_xoshiro = { version = "0.8", features = ["serde"] }
rustc-hash = "2.0"
scopeguard = "1.0"
serde = { version = "1.0.104", features = ["rc", "derive"] }
smallvec = "1.0"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.bw_dat]
path = "bw_dat"
features = ["serde"]

[target.'cfg(target_arch = "x86")'.dependencies.whack]
git = "https://github.com/neivv/whack/"
rev = "03a8b0db17c40913b845987e0fe6ed0cdd8e71eb"

[target.'cfg(target_arch = "x86")'.dependencies.samase_shim]
git = "https://github.com/neivv/samase_plugin"
rev = "c01a88f00b1aaf6286f96940b0f04498cea6c7b7"

[dependencies.samase_plugin]
git = "https://github.com/neivv/samase_plugin"
rev = "c01a88f00b1aaf6286f96940b0f04498cea6c7b7"
